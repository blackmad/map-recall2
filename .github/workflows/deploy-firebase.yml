name: Deploy to Firebase Hosting

# Deployment has its own reproducible release checks. The broader Canal CI
# includes local evidence/review tests and must not starve Hosting releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  # Finish publishing both sites; keep only the newest pending push.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # No DEPLOY_TARGET here: each Firebase site serves from its own domain
      # root, so the build keeps Vite's default '/' base.
      - run: npm run build
        env:
          VITE_CANAL_RECALL_URL: https://canalrecall.blackmad.com/
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: node scripts/assemble-canalrecall-site.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - name: Stamp deployed revision
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const sha = process.env.GITHUB_SHA || '';
          const revision = JSON.stringify({
            sha,
            short: sha.slice(0, 7),
            run: process.env.GITHUB_RUN_ID,
            builtAt: new Date().toISOString(),
          });
          for (const site of ['dist', 'dist-canalrecall']) {
            writeFileSync(`${site}/deployment.json`, revision);
          }
          JS
      - name: Write deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
      # One command publishes both targets: edumap (Map Quest at the site root)
      # and canalrecall (Canal Recall, rewritten from the site root).
      - name: Deploy hosting targets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@15 deploy --only hosting --project map-recall2-blackmad --non-interactive
      - name: Verify live revision on both sites
        run: |
          for site in edumap-blackmad canalrecall-blackmad; do
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error "https://${site}.web.app/deployment.json?sha=${GITHUB_SHA}" | \
                node -e 'let body=""; process.stdin.on("data", c => body += c); process.stdin.on("end", () => { if (JSON.parse(body).sha !== process.env.GITHUB_SHA) process.exit(1); });'; then
                break
              fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 5
            done
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
