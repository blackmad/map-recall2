name: Deploy to Firebase Hosting

# Deployment has its own reproducible release checks. The broader Canal CI
# includes local evidence/review tests and must not starve Hosting releases.
on:
  push:
    branches: [main]
    # A push that only touches docs or the boards does not change either site; every deploy stores
    # ~290 MB of versions against the 10 GB Hosting quota (2026-10-13: ~40 deploys a day filled it).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  # A burst of pushes deploys once: a newer push cancels the run in progress
  # (2026-10-14, user's call). A cancelled firebase deploy leaves at most a
  # CREATED version, which stores nothing against the quota.
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so the Sentry source-map step can guard on `env.SENTRY_AUTH_TOKEN`.
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Write Canal Recall's runtime config before Vite copies public/ to dist/
      # and before the canalrecall site is assembled, so the deployed page reads
      # the deploy-time Sentry / App Check keys.
      - name: Write Canal Recall runtime config
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_SHA: ${{ github.sha }}
          APPCHECK_SITE_KEY: ${{ secrets.APPCHECK_SITE_KEY }}
          ANALYTICS_ENDPOINT: /api/analytics
        run: node scripts/write-runtime-config.mjs
      # No DEPLOY_TARGET here: each Firebase site serves from its own domain
      # root, so the build keeps Vite's default '/' base.
      - run: npm run build
        env:
          VITE_CANAL_RECALL_URL: https://rideamsterdam.nl/
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Map Quest reports to its own Sentry project; Canal Recall uses SENTRY_DSN.
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_MAP_QUEST }}
          VITE_RELEASE: ${{ github.sha }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.APPCHECK_SITE_KEY }}
      # Upload Vite source maps to Sentry, then delete them so they never deploy.
      # Both upload steps are gated on the SENTRY_AUTH_TOKEN secret; with no
      # token the maps are simply deleted and nothing symbolicates.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: whizziwig
          SENTRY_PROJECT: map-quest
        run: |
          # Map Quest is served from the /quiz/ build (dist-quiz).
          npx @sentry/cli sourcemaps inject dist-quiz
          npx @sentry/cli sourcemaps upload --release "$GITHUB_SHA" dist-quiz
      # Canal Recall is a static page outside Vite: its ride scripts are esbuild
      # bundles under dist/canal-drive/js. The collector takes only the scripts
      # index.html loads (plus the lazily loaded monitoring bundle); the gallery
      # harnesses never initialise Sentry, so their maps would be dead weight.
      # Library code also reports through the ride's own bundles, so one project
      # covers the whole surface.
      - name: Upload Canal Recall source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: whizziwig
          SENTRY_PROJECT: canal-recall
        run: |
          node scripts/sentry/collect-canal-bundles.mjs
          npx @sentry/cli sourcemaps inject .tmp/sentry-canal-recall
          npx @sentry/cli sourcemaps upload --release "$GITHUB_SHA" .tmp/sentry-canal-recall
          # Serve exactly the debug-id-injected scripts the uploaded maps belong to.
          cp -R .tmp/sentry-canal-recall/js/. dist/canal-drive/js/
      # Hidden source maps are never served, uploaded or not. The esbuild ride
      # bundles write external maps next to their output in public/, so those go
      # too: they must not be assembled into a deploy by a later re-run either.
      - run: find dist dist-quiz public/canal-drive/js -name '*.map' -delete
      - run: rm -rf .tmp/sentry-canal-recall
      - run: node scripts/assemble-canalrecall-site.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - name: Stamp deployed revision
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const sha = process.env.GITHUB_SHA || '';
          const revision = JSON.stringify({
            sha,
            short: sha.slice(0, 7),
            run: process.env.GITHUB_RUN_ID,
            builtAt: new Date().toISOString(),
          });
          // dist-canalrecall/quiz answers the edumap host, which now redirects there.
          for (const site of ['dist', 'dist-edumap', 'dist-canalrecall', 'dist-canalrecall/quiz']) {
            writeFileSync(`${site}/deployment.json`, revision);
          }
          JS
      - name: Write deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
      # One command publishes both targets: canalrecall (landing at /, the ride
      # at /ride, Map Quest at /quiz/) and edumap (a redirect to /quiz/).
      - name: Deploy hosting targets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@15 deploy --only hosting --project map-recall2-blackmad --non-interactive
      # The same build on Cloudflare Pages (project `rideamsterdam`), which serves
      # rideamsterdam.nl without bandwidth charges (2026-10-21). Routing comes from
      # firebase.json through build-pages-site.mjs. Skipped until both secrets exist.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/hosting/build-pages-site.mjs
          for attempt in 1 2 3; do
            npx --yes wrangler@4 pages deploy dist-pages --project-name rideamsterdam --branch main --commit-hash "$GITHUB_SHA" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://rideamsterdam.pages.dev/deployment.json?sha=${GITHUB_SHA}" | grep -q "$GITHUB_SHA"; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify live revision on both sites
        run: |
          for site in edumap-blackmad canalrecall-blackmad; do
            for attempt in 1 2 3 4 5; do
              # edumap redirects to canalrecall's /quiz/deployment.json: following it checks the redirect is live.
              if curl --fail --silent --show-error --location "https://${site}.web.app/deployment.json?sha=${GITHUB_SHA}" | \
                node -e 'let body=""; process.stdin.on("data", c => body += c); process.stdin.on("end", () => { if (JSON.parse(body).sha !== process.env.GITHUB_SHA) process.exit(1); });'; then
                break
              fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 5
            done
          done
      # Retention Firebase's maxVersions does not do: delete stored versions
      # beyond the live one and the newest 3 per site, so ~40 deploys a day
      # cannot fill the 10 GB quota again (2026-10-14, user's call). Never fails
      # the deploy.
      - name: Prune stored hosting versions
        if: success()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/hosting/prune-versions.mjs --keep=3 --apply || echo "prune failed; deploy is live"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
