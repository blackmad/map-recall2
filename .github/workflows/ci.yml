name: Canal CI

on:
  pull_request:
  push:
    branches: [main]

# On main a run in progress finishes (GitHub keeps one pending run, the newest push): with several sessions pushing
# more often than a run takes (~8 min), cancel-in-progress meant no main run completed and the Pages deploy, which
# waits for a green run, was skipped for hours (2026-10-17). Pull requests still cancel superseded runs.
concurrency:
  group: canal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # check:canal runs as three parallel jobs (2026-11-12): run serially it passed 45 min on the runner, every main
  # run was cancelled and Pages stopped deploying from 2026-11-10. check:rail-street alone takes ~17 min there.
  # Locally `npm run check:canal` still runs the same chain (core && rail && rest).
  check-canal:
    name: check:canal (${{ matrix.part }})
    runs-on: ubuntu-latest
    # rail ran 41.5 min of 45 on the first split run (2026-11-12)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [core, rail, rest, joins]
    steps:
      # The landmark-inventory gate dates each model by the commit that first added its GLB, so check:canal needs the
      # history (commits and trees only: blob:none keeps it small). A shallow clone dated every model "today".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # check:canal includes focused Playwright specs (building-look), so the jobs need a browser too (2026-10-29).
      - run: npx playwright install --with-deps chromium
      - run: npm run check:canal:${{ matrix.part }}

  e2e-smoke:
    name: e2e smoke (boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14
