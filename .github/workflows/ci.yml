name: Canal CI

on:
  pull_request:
  push:
    branches: [main]

# On main a run in progress finishes (GitHub keeps one pending run, the newest push): with several sessions pushing
# more often than a run takes (~8 min), cancel-in-progress meant no main run completed and the Pages deploy, which
# waits for a green run, was skipped for hours (2026-10-17). Pull requests still cancel superseded runs.
concurrency:
  group: canal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-canal:
    name: check:canal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The landmark-inventory gate dates each model by the commit that first added its GLB, so check:canal needs the
      # history (commits and trees only: blob:none keeps it small). A shallow clone dated every model "today".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:canal

  e2e-smoke:
    name: e2e smoke (boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14

  e2e:
    name: e2e full
    needs: [e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
