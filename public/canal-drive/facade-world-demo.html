<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Façade grammar in Amsterdam 3D</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><style>html,body,#map{height:100%;margin:0;background:#071820}.panel{position:absolute;z-index:2;left:16px;top:16px;width:330px;padding:15px 17px;border:1px solid #45606b;border-radius:8px;background:#0b1b22eF;color:#eaf2f4;font:13px/1.45 ui-monospace,monospace;box-shadow:0 12px 35px #0008}.panel h1{font-size:17px;color:#74dff3;margin:0 0 7px}.panel p{color:#a9bcc3;margin:5px 0}.legend{display:flex;gap:14px;margin-top:10px}.legend i{display:inline-block;width:11px;height:11px;margin-right:5px}.maplibregl-popup-content{background:#10242c;color:#fff;font:12px ui-monospace,monospace}</style></head><body><div id="map"></div><aside class="panel"><h1>Façade grammar · world pilot</h1><p>Real Amsterdam footprints. Teacher-inferred storeys, bays, colour, windows and entrances become depth-correct 3D geometry.</p><div class="legend"><span><i style="background:#765345"></i>grammar wall</span><span><i style="background:#203944"></i>opening</span></div><p>Click a pilot building. Machine proposals only.</p></aside><script>
const localStyle={version:8,sources:{},layers:[{id:'ground',type:'background',paint:{'background-color':'#173039'}}]},map=new maplibregl.Map({container:'map',style:localStyle,center:[4.9639,52.3247],zoom:17.1,pitch:68,bearing:-28,antialias:true});map.on('load',()=>{map.addSource('city',{type:'geojson',data:'../data/extracts/amsterdam/buildings-colored.geojson'});map.addLayer({id:'city',type:'fill-extrusion',source:'city',minzoom:13,paint:{'fill-extrusion-color':'#75807d','fill-extrusion-height':['coalesce',['get','height'],6],'fill-extrusion-opacity':.58}});map.addSource('grammar',{type:'geojson',data:'../data/facade-block-demo/world.geojson'});map.addLayer({id:'grammar-walls',type:'fill-extrusion',source:'grammar',filter:['==',['get','kind'],'facade'],paint:{'fill-extrusion-color':['get','colour'],'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':1}});map.addLayer({id:'grammar-openings',type:'fill-extrusion',source:'grammar',filter:['in',['get','kind'],['literal',['window','door']]],paint:{'fill-extrusion-color':['get','colour'],'fill-extrusion-base':['get','base'],'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':1}});map.on('click','grammar-walls',e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<b>'+p.id+'</b><br>'+p.height+' m procedural façade').addTo(map)});map.on('mouseenter','grammar-walls',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','grammar-walls',()=>map.getCanvas().style.cursor='')});
</script></body></html>
