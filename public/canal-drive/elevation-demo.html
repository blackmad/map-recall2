<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amsterdam elevation preview</title>
<style>body{margin:0;font:15px system-ui;background:#f4f1e8;color:#202b34}header{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}strong{margin-right:10px}button{font:inherit;padding:7px 12px;background:white;border:1px solid #b8c1c5;border-radius:6px;cursor:pointer}button.active{background:#d2e3f3}small{color:#54646c}iframe{border:0;width:100%;height:calc(100dvh - 110px)}p{margin:0;padding:0 16px 10px;font-size:13px;color:#54646c}</style>
<header><strong>Amsterdam elevation preview</strong><button data-id="BRU0057">Papiermolensluis</button><button data-id="BRU0059">Lekkeresluis</button><button data-id="BRU0065">Berensluis</button><button id="side">Other bank</button><button id="terrain">Elevation: on</button><button id="bridges">Detailed bridges: on</button><small id="status">Starting the game…</small></header>
<p>Work in progress. Drag to pan; scroll to zoom; right-drag to rotate. These three crossings are under visual review. <a href="./?terrain=1&bridges3d=1" target="_blank">Open normal gameplay</a></p>
<iframe id="game" title="Live Canal Recall elevation preview" src="./?terrain=1&bridges3d=1"></iframe>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status');let vm,game,selected='BRU0057',bearing=120;
function focus(id){if(id!==selected)bearing=id==='BRU0065'?60:120;selected=id;const bridge=vm?._measuredBridges?.bridges.find(b=>b.id===id);if(!bridge)return;const sample=bridge.samples.find(s=>s.s>(bridge.deckRangeM[0]+bridge.deckRangeM[1])/2);const center=[bridge.origin[0]+sample.point[0]/(111320*Math.cos(bridge.origin[1]*Math.PI/180)),bridge.origin[1]+sample.point[1]/111320];const loader=game.osmLoader;game.player.x=loader._lastOffsetX+(center[0]-loader._lastCenterLng)*111320*Math.cos(loader._lastCenterLat*Math.PI/180)*3;game.player.y=loader._lastOffsetY-(center[1]-loader._lastCenterLat)*111320*3;game.player.speed=game.player.vx=game.player.vy=0;vm.map.setMaxPitch(85);vm.map.jumpTo({center,zoom:20,pitch:60,bearing});for(const b of document.querySelectorAll('[data-id]'))b.classList.toggle('active',b.dataset.id===id);}
for(const button of document.querySelectorAll('[data-id]'))button.onclick=()=>focus(button.dataset.id);
document.getElementById('side').onclick=()=>{bearing=(bearing+180)%360;focus(selected)};
document.getElementById('terrain').onclick=e=>{if(!vm)return;vm._elevation.setEnabled(!vm._elevation.enabled);e.target.textContent='Elevation: '+(vm._elevation.enabled?'on':'off');focus(selected)};
document.getElementById('bridges').onclick=e=>{if(!vm)return;vm._measuredBridges.setEnabled(!vm._measuredBridges.enabled);e.target.textContent='Detailed bridges: '+(vm._measuredBridges.enabled?'on':'off')};
let started=false,inspection=false;const timer=setInterval(()=>{try{const w=frame.contentWindow;game=w.canalRecallGame;if(!game?.vectorMap?.ready)return;vm=game.vectorMap;if(!started){const d=frame.contentDocument;const travel=d.getElementById('travel-mode'),view=d.getElementById('view-mode');travel.value='car';travel.dispatchEvent(new w.Event('change',{bubbles:true}));view.value='chase';view.dispatchEvent(new w.Event('change',{bubbles:true}));d.getElementById('route-card').requestSubmit();started=true;}if(!game.player?.x||!vm._measuredBridges?.ready)return;if(!inspection){const style=frame.contentDocument.createElement('style');style.textContent='#gameCanvas{visibility:hidden}#canal-overlay-root,#canal-prompt,#utility-buttons{display:none!important}';frame.contentDocument.head.append(style);game.state=4;game._updateRacing=()=>{};vm.sync=()=>{};vm.setPlayerBike=()=>{if(vm._playerBike)vm._playerBike.visible=false;};vm.setPlayerBoat=()=>{if(vm._playerBoat)vm._playerBoat.visible=false;};frame.contentDocument.getElementById('gameCanvas').style.pointerEvents='none';frame.contentDocument.getElementById('vector-map').style.pointerEvents='auto';vm.map.dragPan.enable();vm.map.dragRotate.enable();vm.map.scrollZoom.enable();vm.map.touchZoomRotate.enable();focus(selected);inspection=true;}const surface=vm._elevation.surfaces?.status();status.textContent=!vm._elevation.enabled?'Flat comparison':!surface?.geometryReady?'Loading nearby geometry…':`Ready · ${vm._measuredBridges.activeIds.size} detailed bridges`;}catch(e){status.textContent=String(e.message)}},400);
</script></html>
