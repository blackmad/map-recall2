<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge matching near the Jordaan</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>*{box-sizing:border-box}body{margin:0;color:#26342f;background:#f4f2eb;font:15px system-ui,sans-serif}header{padding:16px 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #cdcfc5}h1{font-size:21px;margin:0}header a{margin-left:auto}a{color:#295c50}main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 62px)}aside{padding:20px;overflow:auto}p{line-height:1.5}#map{height:100%;min-height:400px}button{font:inherit;cursor:pointer;border:1px solid #b6c5b8;background:#fff;border-radius:5px;padding:10px;text-align:left}#cards{display:grid;gap:8px}#cards button.active{border-color:#81407d;background:#f0e6ef}small{display:block;margin-top:4px;color:#5d6962}.legend{display:grid;gap:10px;padding:14px 0;border-top:1px solid #d4d8ce;border-bottom:1px solid #d4d8ce}.legend label{display:flex;align-items:center;gap:8px}.swatch{width:20px;height:5px;background:var(--color)}h2{font-size:18px}dl{display:grid;grid-template-columns:1fr auto;gap:8px}dd{margin:0}#roads{padding-left:20px;line-height:1.6}#photo{width:100%;max-height:180px;object-fit:cover;margin-top:14px}#overview{width:100%;margin:12px 0}#loading{position:absolute;top:90px;right:28px;background:#fff;padding:10px} @media(max-width:760px){main{display:flex;flex-direction:column;height:auto}#map{height:55vh;order:-1}header{padding:12px}h1{font-size:17px}aside{overflow:visible}}</style></head>
<body><header><h1>Bridge matching near the Jordaan</h1><a href="bridge-pilot.html">3D bridge gallery</a></header><main><aside>
<p id="intro">Loading local source data…</p>
<div class="legend"><label><span class="swatch" style="--color:#963b91"></span> Municipal bridge footprint</label><label><input type="checkbox" id="routes" checked><span class="swatch" style="--color:#747c82"></span> Cycling-routing paths</label><label><input type="checkbox" id="tagged" checked><span class="swatch" style="--color:#de7a29"></span> Routing paths tagged as bridges</label><label><input type="checkbox" id="catalog" checked><span class="swatch" style="--color:#168765"></span> Separate bridge-catalogue geometry</label><label><input type="checkbox" id="recovered" checked><span class="swatch" style="--color:#347cc2"></span> Recovered OSM bridge / pedestrian paths</label></div>
<button id="overview">Show all nearby examples</button><div id="cards" style="max-height:165px;overflow-y:auto"></div>
<h2 id="title"></h2><p id="diagnosis"></p><dl id="facts"></dl><p><strong>Closest paths in the cycling extract</strong></p><ul id="roads"></ul><p id="references"></p><div id="photo" hidden></div>
<p><small>Unmatched is a source/matcher result. It does not mean the real bridge is absent. The green catalogue geometry is separate from the grey/orange routing data.</small></p>
</aside><div id="map" aria-label="Map of unmatched bridge footprints and extracted paths"></div></main><div id="loading">Loading map…</div>
<script>
const map=new maplibregl.Map({container:'map',center:[4.879,52.376],zoom:15.5,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}},layers:[{id:'base',type:'raster',source:'osm',paint:{'raster-opacity':.65,'raster-saturation':-.8}}]}});
map.addControl(new maplibregl.NavigationControl());
let data,selected;
const loaded=new Promise(resolve=>map.on('load',resolve));
function select(id){const e=data.examples.find(e=>e.id===id);selected=e;document.querySelectorAll('#cards button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
document.getElementById('title').textContent=`${e.label} · ${e.id.replace('BRU','')}`;document.getElementById('diagnosis').textContent=e.diagnosis;
const facts=document.getElementById('facts');facts.replaceChildren();for(const[label,value]of [['Current status',e.status==='ready'?'Rendered':e.status==='unmatched'?'Unmatched':'Matched · review'],['Municipal material',e.material||'Unknown'],['Type',e.type],['Street/water',e.street||'Not recorded'],['Catalogue centreline',e.catalogLines?'Present':'Absent'],['Recovered OSM crossing',e.recoveredLines?'Present':'Absent']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;facts.append(dt,dd);}
const roads=document.getElementById('roads');roads.replaceChildren();for(const r of e.nearest){const li=document.createElement('li');li.textContent=`${r.name||r.highway}: ${r.distanceM} m away · ${r.bridge?'bridge tagged':'no bridge flag'} (${r.id})`;roads.append(li);}
const refs=document.getElementById('references');refs.replaceChildren();const osm=document.createElement('a');osm.textContent='Open this location in OpenStreetMap';osm.href=`https://www.openstreetmap.org/?mlat=${e.center[1]}&mlon=${e.center[0]}#map=19/${e.center[1]}/${e.center[0]}`;osm.target='_blank';osm.rel='noopener';refs.append(osm);
if(e.reference){const link=document.createElement('a');link.textContent='Bridge reference / photo source';link.href=e.reference;link.target='_blank';link.rel='noopener';refs.append(document.createElement('br'),link);}
const photo=document.getElementById('photo');photo.replaceChildren();photo.hidden=!e.photo;if(e.photo){const image=document.createElement('img');image.src=e.photo;image.alt=`Reference photograph of ${e.label}`;image.style.cssText='width:100%;max-height:180px;object-fit:cover';image.onerror=()=>photo.hidden=true;photo.append(image);}
map.setFilter('selection',['==',['get','id'],id]);map.flyTo({center:e.center,zoom:18.5,duration:450});}
function overview(){const bounds=new maplibregl.LngLatBounds();data.examples.forEach(e=>bounds.extend(e.center));map.fitBounds(bounds,{padding:65,duration:450});}
Promise.all([fetch('../data/extracts/amsterdam/unmatched-jordaan.json').then(r=>r.json()),loaded]).then(([value])=>{data=value;
document.getElementById('intro').textContent=`${data.examples.length} examples near the Jordaan, including previously unmatched bridges. ${data.unmatchedTotal} municipal records remain unmatched citywide. Select a bridge and toggle the source layers to compare.`;
map.addSource('recovered',{type:'geojson',data:data.recovered});
map.addSource('routes',{type:'geojson',data:data.routes});map.addSource('catalog',{type:'geojson',data:data.catalog});
map.addSource('footprints',{type:'geojson',data:{type:'FeatureCollection',features:data.examples.map(e=>({type:'Feature',properties:{id:e.id,label:e.label},geometry:{type:'Polygon',coordinates:[e.outline]}}))}});
map.addLayer({id:'routing-lines',type:'line',source:'routes',paint:{'line-color':'#747c82','line-width':2.5,'line-opacity':.85}});
map.addLayer({id:'tagged-lines',type:'line',source:'routes',filter:['==',['get','bridge'],true],paint:{'line-color':'#de7a29','line-width':5}});
map.addLayer({id:'catalog-lines',type:'line',source:'catalog',paint:{'line-color':'#168765','line-width':4,'line-opacity':.9}});
map.addLayer({id:'recovered-lines',type:'line',source:'recovered',paint:{'line-color':'#347cc2','line-width':2,'line-opacity':.8}});
map.addLayer({id:'municipal-fill',type:'fill',source:'footprints',paint:{'fill-color':'#963b91','fill-opacity':.3}});
map.addLayer({id:'municipal-edge',type:'line',source:'footprints',paint:{'line-color':'#963b91','line-width':3}});
map.addLayer({id:'selection',type:'line',source:'footprints',filter:['==',['get','id'],''],paint:{'line-color':'#52234d','line-width':6}});
for(const e of data.examples){const b=document.createElement('button');b.dataset.id=e.id;b.textContent=`${e.label} · ${e.id.replace('BRU','')}`;const s=document.createElement('small');s.textContent=`${e.status==='ready'?'Rendered':e.status==='unmatched'?'Unmatched':'Matched · review'} · ${e.street||'Municipal footprint'}`;b.append(s);b.onclick=()=>select(e.id);document.getElementById('cards').append(b);
const marker=document.createElement('button');marker.textContent=e.id.replace('BRU','');marker.style.cssText='background:#963b91;color:white;border:2px solid white;border-radius:18px;padding:4px 7px;font-size:12px';marker.onclick=()=>select(e.id);new maplibregl.Marker({element:marker,anchor:'bottom'}).setLngLat(e.center).addTo(map);}
for(const [control,layer]of [['routes','routing-lines'],['tagged','tagged-lines'],['catalog','catalog-lines'],['recovered','recovered-lines']])document.getElementById(control).onchange=e=>map.setLayoutProperty(layer,'visibility',e.target.checked?'visible':'none');
document.getElementById('overview').onclick=overview;map.on('click','municipal-fill',e=>select(e.features[0].properties.id));map.on('mouseenter','municipal-fill',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','municipal-fill',()=>map.getCanvas().style.cursor='');
select(data.examples.some(e=>e.id===location.hash.slice(1))?location.hash.slice(1):'BRU0130');document.getElementById('loading').remove();window.unmatchedReviewReady=true;window.unmatchedReview={data,map,select,overview};window.addEventListener('hashchange',()=>{if(data.examples.some(e=>e.id===location.hash.slice(1)))select(location.hash.slice(1));});
}).catch(e=>{document.getElementById('loading').textContent=String(e);});
</script></body></html>
