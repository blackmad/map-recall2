<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procedural façade block</title><style>
:root{color-scheme:dark;--ink:#101315;--panel:#1a2024;--line:#354149;--muted:#94a0a7;--accent:#ffd36a}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--ink);color:#edf1f3;font:13px/1.4 ui-monospace,SFMono-Regular,monospace}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:18px;padding:13px 18px;border-bottom:1px solid var(--line);background:#151a1d}.bar h1{margin:0;font-size:18px;color:var(--accent)}.bar p{margin:0;color:var(--muted)}button{margin-left:auto;padding:8px 11px;border:1px solid #61717a;border-radius:5px;background:#273138;color:#fff;font:inherit;cursor:pointer}.main{min-height:0;display:grid;grid-template-columns:minmax(600px,1fr) 370px}.stage{position:relative;overflow:hidden;background:linear-gradient(#698899 0 55%,#4a5152 55% 69%,#242b2d 69%)}canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:16px;bottom:14px;padding:7px 10px;background:#101315cc;border-radius:5px;color:#d9e1e4}.panel{overflow:auto;padding:17px;border-left:1px solid var(--line);background:var(--panel)}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em}.panel h2{margin:4px 0 2px}.sub{color:var(--muted);margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}.grid span:nth-child(odd){color:var(--muted)}.source{font-size:10px;color:#77dca2}.source.disputed{color:#ffba74}.models{margin-top:15px;padding:10px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}@media(max-width:850px){.main{grid-template-columns:1fr;grid-template-rows:58vh auto}.panel{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><main class="shell"><header class="bar"><div><h1>Procedural façade study block</h1><p>Two vision models → semantic grammar → simplified street character</p></div><button id="reroll">Reroll secondary details</button></header><section class="main"><div class="stage"><canvas id="canvas"></canvas><div class="hint">Click a building to inspect its grammar</div></div><aside class="panel"><div class="eyebrow">machine-proposed grammar</div><h2 id="name">Loading…</h2><p class="sub" id="status"></p><div id="grammar"></div><div class="models" id="models"></div></aside></section></main><script type="module">
const data=await fetch('../data/facade-block-demo/grammars.json').then(r=>r.json()),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),nameEl=document.querySelector('#name'),statusEl=document.querySelector('#status'),grammarEl=document.querySelector('#grammar'),modelsEl=document.querySelector('#models'),rerollEl=document.querySelector('#reroll');let selected=0,variation=0,boxes=[];const colours={brown:'#765345',red:'#934e3d',yellow:'#c7aa70',cream:'#d4c7a8',white:'#d9d9d2',grey:'#898d8c',black:'#333536',blue:'#587589',green:'#687c67',mixed:'#8a7668',unknown:'#8d8174'};const frameColours={white:'#e8e5d9',grey:'#90999b',black:'#24282a',brown:'#65483b','natural-wood':'#9a7048'};const val=(g,k,f)=>g[k]??f;
const textureImages={};for(const [key,url] of Object.entries({warm:'../data/facade-materials/Bricks104_1K-JPG_Color.jpg',light:'../data/facade-materials/polyhaven-brick-wall-003.jpg'})){const image=new Image;image.src=url;image.onload=render;textureImages[key]=image}
const noise=(id,n)=>{let h=2166136261;for(const c of id+':'+variation+':'+n)h=Math.imul(h^c.charCodeAt(0),16777619);return(h>>>0)/4294967295},shade=(hex,amount)=>{const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,v+amount));return'#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')};
function door(x,y,w,h,frame,id,n){const dark=shade(frame,-48),panel=shade(frame,-18+Math.round(noise(id,n)*25));ctx.fillStyle='#151b1e';ctx.fillRect(x-3,y-4,w+6,h+4);ctx.fillStyle=panel;ctx.fillRect(x,y,w,h);if(noise(id,n+1)>.38){ctx.fillStyle='#29404a';ctx.fillRect(x+4,y+5,w-8,Math.max(9,h*.27));ctx.strokeStyle='#a9bdc4';ctx.lineWidth=1;ctx.strokeRect(x+4,y+5,w-8,Math.max(9,h*.27))}else{ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.strokeRect(x+4,y+7,w-8,h*.25)}ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.strokeRect(x+4,y+h*.48,w-8,h*.36);ctx.fillStyle='#d7bd72';ctx.beginPath();ctx.arc(x+(noise(id,n+2)>.5?6:w-6),y+h*.58,1.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0e1417';ctx.fillRect(x,y+h-3,w,3)}
function roof(x,y,w,type,wall){ctx.fillStyle=wall;if(type==='triangular-gable'||type==='spout-gable'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w/2,y-42);ctx.lineTo(x+w,y);ctx.fill()}else if(['stepped-gable','bell-gable','neck-gable'].includes(type)){ctx.fillRect(x+w*.18,y-32,w*.64,32);ctx.fillRect(x+w*.3,y-48,w*.4,18)}else if(type==='mansard-eave'){ctx.fillStyle='#4c4440';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,y-32);ctx.lineTo(x+w-12,y-32);ctx.lineTo(x+w,y);ctx.fill()}else{ctx.fillStyle='#343a3c';ctx.fillRect(x,y-5,w,6)}}
function building(b,i,total){const g=b.grammar,stageW=canvas.width/devicePixelRatio,stageH=canvas.height/devicePixelRatio,gap=9,w=(stageW-80-gap*(total-1))/total,x=40+i*(w+gap),storeys=Math.max(2,Math.min(6,Number(val(g,'visibleStoreys',3)))),floor=70,y=stageH*.67-storeys*floor,baseWall=colours[val(g,'facadeColour','brown')]||colours.brown,wall=shade(baseWall,Math.round((noise(b.id,0)-.5)*18)),bays=Math.max(2,Math.min(8,Number(val(g,'bayCount',4)))),groundDistinct=val(g,'groundFloorDistinct',false),frame=frameColours[val(g,'windowFrameColour','white')]||frameColours.white;ctx.save();ctx.shadowColor='#0008';ctx.shadowBlur=14;ctx.fillStyle=wall;ctx.fillRect(x,y,w,storeys*floor);ctx.shadowBlur=0;const texture=['cream','yellow','white'].includes(String(g.facadeColour))?textureImages.light:textureImages.warm;if(g.facadeMaterial==='brick'&&texture.complete){const pattern=ctx.createPattern(texture,'repeat');pattern?.setTransform(new DOMMatrix().scale(.13));ctx.save();ctx.globalAlpha=.24;ctx.globalCompositeOperation='multiply';ctx.fillStyle=pattern;ctx.fillRect(x,y,w,storeys*floor);ctx.restore()}if(groundDistinct){ctx.fillStyle=noise(b.id,1)>.5?'#00000020':'#ffffff12';ctx.fillRect(x,y+(storeys-1)*floor,w,floor)}ctx.fillStyle='#ffffff0c';for(let row=1;row<storeys;row++)ctx.fillRect(x,y+row*floor-2,w,4);const margin=12,bayW=(w-margin*2)/bays,ratio=val(g,'windowToWall','medium'),windowW=bayW*(ratio==='high'?.78:ratio==='low'?.42:.6),pattern=val(g,'windowPattern','regular-grid');for(let row=0;row<storeys;row++){for(let bay=0;bay<bays;bay++){let wx=x+margin+bay*bayW+(bayW-windowW)/2,wy=y+row*floor+16,wh=31;if(pattern==='wide-horizontal'){wh=23;wx-=3}else if(pattern==='narrow-vertical'){wh=38}if(pattern==='irregular')wy+=((bay*17+row*11+variation*7)%13)-6;const lit=noise(b.id,row*17+bay+10)>.78;ctx.fillStyle=lit?'#b49a63':'#18282f';ctx.fillRect(wx,wy,windowW,wh);ctx.strokeStyle=frame;ctx.lineWidth=3;ctx.strokeRect(wx,wy,windowW,wh);ctx.fillStyle=lit?'#ffe6a344':'#8eb0be55';ctx.fillRect(wx+4,wy+4,Math.max(1,windowW*(noise(b.id,row+bay+30)>.5?.38:.62)),Math.max(1,wh-8));if(noise(b.id,row*31+bay+60)>.7){ctx.strokeStyle='#d9d2bd99';ctx.lineWidth=1;for(let blind=wy+7;blind<wy+wh-3;blind+=5){ctx.beginPath();ctx.moveTo(wx+3,blind);ctx.lineTo(wx+windowW-3,blind);ctx.stroke()}}}}const gy=y+(storeys-1)*floor,type=val(g,'groundFloorType','residential-base');if(type==='commercial-glazing'||type==='shopfront'){ctx.fillStyle='#263b42';ctx.fillRect(x+10,gy+10,w-20,floor-16);ctx.strokeStyle=frame;ctx.lineWidth=3;for(let q=1;q<bays;q++){const qx=x+q*w/bays;ctx.beginPath();ctx.moveTo(qx,gy+10);ctx.lineTo(qx,gy+floor-6);ctx.stroke()}if(noise(b.id,90)>.45){ctx.fillStyle='#d9b45e';ctx.fillRect(x+12,gy+12,w-24,7)}}else{const entrance=val(g,'entranceType','multiple-doors'),doors=entrance==='single-residential'||entrance==='shared-residential'?1:Math.min(3,bays),doorW=entrance==='shared-residential'?30:24;for(let d=0;d<doors;d++){const dx=x+16+d*(w-32-doorW)/Math.max(1,doors-1);door(dx,gy+19,doorW,51,frame,b.id,100+d*4)}}const balcony=val(g,'balconyType','none');if(balcony!=='none'&&balcony!=='not-visible'){ctx.strokeStyle='#d2d6d4';ctx.lineWidth=2;for(let row=0;row<storeys-1;row++){const by=y+(row+1)*floor-15;ctx.fillStyle='#30383aaa';ctx.fillRect(x+5,by,w-10,7);ctx.strokeRect(x+5,by-17,w-10,24);if(noise(b.id,row+130)>.55){ctx.fillStyle='#4e7554';for(let p=0;p<3;p++){ctx.beginPath();ctx.arc(x+18+p*15,by-4,5,0,Math.PI*2);ctx.fill()}}}}roof(x,y,w,val(g,'roofline','flat-parapet'),wall);if(val(g,'ornament','minimal')!=='minimal'){ctx.strokeStyle='#d2bb8b';ctx.lineWidth=4;ctx.strokeRect(x+4,y+4,w-8,storeys*floor-8)}ctx.restore();boxes.push({x,y,w,h:storeys*floor,b})}
function render(){const rect=canvas.getBoundingClientRect(),d=devicePixelRatio;canvas.width=rect.width*d;canvas.height=rect.height*d;ctx.setTransform(d,0,0,d,0,0);boxes=[];ctx.fillStyle='#ffffff16';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(30+i*110,70+(i%3)*18,18+(i%4)*6,0,Math.PI*2);ctx.fill()}data.buildings.forEach((b,i)=>building(b,i,data.buildings.length));show(selected)}function show(i){selected=i;const b=data.buildings[i],g=b.grammar;nameEl.textContent=b.id;statusEl.textContent=(b.distanceFromAnchorMetres?b.distanceFromAnchorMetres+' m from anchor · ':'anchor building · ')+data.policy.status;grammarEl.innerHTML=Object.entries(g).map(([k,v])=>'<div class="grid"><span>'+k+'</span><b>'+String(v??'—')+'</b><span></span><small class="source '+(b.provenance[k]==='model-disputed'?'disputed':'')+'">'+b.provenance[k]+'</small></div>').join('');modelsEl.textContent='Inferred by '+data.models.map(x=>x.split('/').pop()).join(' + ')+'. Consensus drives the render; disputed counts are averaged and disputed categories use the higher-visibility proposal.'}canvas.onclick=e=>{const x=e.offsetX,y=e.offsetY,hit=boxes.findIndex(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(hit>=0)show(hit)};rerollEl.onclick=()=>{variation++;render()};new ResizeObserver(render).observe(canvas);
</script></body></html>
