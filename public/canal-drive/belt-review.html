<title>Belt review</title>
<!-- Local tool: needs server.ts (/api/belt-review). Source: src/canalRecall/beltReview/, bundled on request at /api/belt-review/page.js. -->
<style>
:root {
  --bg: #16181b; --panel: #1f2226; --panel-2: #272b30; --line: #353a41; --text: #e7e9ec; --muted: #9aa1aa;
  --accent: #f2b33d; --accent-ink: #1a1408; --ok: #5cc28a; --bad: #ef6b5b; --warn: #e3a64a; --claude: #9b8cf2;
  --photo-bg: #0c0d0e; --imgh: calc(100dvh - 292px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
#app { min-height: 100%; display: flex; flex-direction: column; }
a { color: var(--accent); }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.key { display: inline-block; min-width: 1.4em; padding: 0 4px; border-radius: 4px; background: #000a; border: 1px solid var(--line); font: 600 11px/1.5 ui-monospace, Menlo, monospace; text-align: center; color: var(--text); }
.tag { display: inline-block; padding: 0 6px; margin-left: 4px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); font-size: 11px; line-height: 18px; color: var(--muted); }
.tag.warn { color: var(--warn); border-color: #6a5025; } .tag.bad { color: var(--bad); border-color: #6a2f28; margin: 0 4px 2px 0; }
.pill { padding: 2px 8px; border-radius: 99px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.with-claude { color: var(--claude); border-color: var(--claude); } .pill.accepted { color: var(--ok); border-color: var(--ok); }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar .home { font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: .02em; }
.bar .title { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { border-top: 1px solid var(--line); border-bottom: 0; position: sticky; bottom: 0; z-index: 3; }

.foot .status { flex: 1; }
.status { font-size: 12px; color: var(--muted); min-height: 1.4em; } .status.ok { color: var(--ok); } .status.err { color: var(--bad); }
.blockers { color: var(--warn); font-size: 12px; }
.timer { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
.steps { display: flex; gap: 4px; }
.step { display: flex; align-items: center; gap: 4px; max-width: 230px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: transparent; }
.step b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; }
.step.done b { background: var(--ok); color: #08130d; border-color: var(--ok); }
.step.open b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step.on { border-color: var(--accent); background: var(--panel-2); }
.step-t { overflow: hidden; text-overflow: ellipsis; }

main { flex: 1; min-height: 0; }
.face { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.pands { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0 0 4px; overflow-x: auto; scrollbar-width: thin; }
.pand { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 3px 8px; min-width: 92px; background: var(--panel); font-size: 12px; }
.pand .addr { white-space: nowrap; } .pand .mk { font-size: 11px; color: var(--muted); }
.pand.agree { border-left: 3px solid var(--ok); } .pand.override { border-left: 3px solid var(--accent); } .pand.none { border-left: 3px solid var(--bad); }
.pand.open { border-left: 3px solid var(--line); } .pand.cur { border-color: var(--accent); background: var(--panel-2); }
.pand-head { display: flex; align-items: center; gap: 8px; }
.pand-head h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; } .pand-head small { color: var(--muted); font-weight: 400; font-size: 13px; }
.pand-head .nav { font-size: 20px; line-height: 1; padding: 2px 12px; }
button.none.chosen { border-color: var(--bad); color: var(--bad); }
.locked { margin: 0; color: var(--warn); }
.cands { display: flex; gap: 10px; align-items: flex-start; }
.cand { flex: 1 1 0; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.cand-img { position: relative; display: block; width: 100%; padding: 0; cursor: pointer; box-sizing: border-box; border: 2px solid transparent; border-radius: 6px; background: var(--photo-bg); overflow: hidden; }
.cand-img img { display: block; width: 100%; height: var(--imgh); object-fit: contain; }
.cand-img .key { position: absolute; top: 6px; left: 6px; font-size: 13px; }
.cand-img .auto { position: absolute; top: 6px; right: 6px; padding: 1px 6px; border-radius: 4px; background: #000c; color: var(--muted); font-size: 11px; border: 1px solid var(--line); }
.cand-img .chosen-mark { position: absolute; bottom: 6px; left: 6px; padding: 1px 8px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; }
.cand.chosen .cand-img { border-color: var(--accent); }
/* stage 1: BAG span lines, dimmed margin, draggable facade edges and house dividers on the picked photo */
.spanlayer { position: absolute; pointer-events: none; }
.spanlayer.live { pointer-events: auto; cursor: crosshair; }
.spanlayer .dim { position: absolute; top: 0; bottom: 0; background: #0008; pointer-events: none; }
.spanlayer .bagline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed #f2b33d; transform: translateX(-1px); pointer-events: none; opacity: .9; }
.spanlayer .edge, .spanlayer .divider { position: absolute; top: 0; bottom: 0; width: 14px; transform: translateX(-7px); cursor: ew-resize; touch-action: none; }
.spanlayer .edge::after, .spanlayer .divider::after { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: #5cc28a; box-shadow: 0 0 0 1px #0009; }
.spanlayer .divider::after { background: #6fb3ef; }
.spanlayer .sel::after { width: 3px; left: 5px; background: #fff; }
.spanlayer .houselabel { position: absolute; bottom: 26px; text-align: center; line-height: 1.3; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }
.houselabels { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.houselabels:empty { display: none; }
.houselabels input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.addrs { margin-left: 6px; padding: 0 5px; border-radius: 4px; font-size: 10px; background: #6a5025; color: #ffd98a; white-space: nowrap; }
.pand.split { border-style: dashed; }
.cand.strip .cand-img { border-style: dashed; border-color: #6a5025; } .cand.strip.chosen .cand-img { border-color: var(--accent); }
.cand figcaption { font-size: 12px; } .meta-2, .flags.clean { color: var(--muted); }
.empty, .later { color: var(--muted); padding: 30px 0; } .later h2 { color: var(--text); }
.zoom { position: fixed; inset: 0; z-index: 10; background: #000e; overflow: auto; display: grid; place-items: center; }
.zoom img { height: calc(100dvh - 16px); width: auto; max-width: none; image-rendering: auto; }
.zoom-close { position: fixed; top: 10px; right: 10px; }

.index { padding: 16px; max-width: 1200px; width: 100%; } .index table { border-collapse: collapse; width: 100%; }
.index th, .index td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } .index th { color: var(--muted); font-weight: 500; font-size: 12px; }
.index h2 { font-size: 16px; margin: 18px 0 8px; }

.round-wrap { flex: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
.blocks { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100dvh - 45px); position: sticky; top: 0; }
.blocks ol { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.blk { width: 100%; text-align: left; background: transparent; border-color: transparent; font-size: 12px; }
.blk.cur { background: var(--panel-2); border-color: var(--accent); }
.blk .v { display: inline-block; width: 1.3em; text-align: center; font-weight: 700; color: var(--muted); }
.blk.better .v { color: var(--ok); } .blk.worse .v { color: var(--bad); } .blk.same .v { color: var(--text); }
.round { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.round-head { display: flex; align-items: baseline; gap: 10px; } .round-head h2 { margin: 0; font-size: 17px; }
.layers { display: flex; gap: 4px; flex-wrap: wrap; } .layers button.on { border-color: var(--accent); background: #3a3020; }
.stage { position: relative; height: calc(100dvh - 150px); min-height: 280px; background: var(--photo-bg); border-radius: 6px; flex: none; }
.stage.single { height: calc(100dvh - 190px); }
.stage.single img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage.stack, .stage.pair { display: flex; flex-direction: column; gap: 4px; overflow: hidden; padding: 1px; height: auto; min-height: 0; }
.band { position: relative; flex: none; line-height: 0; cursor: zoom-in; align-self: flex-start; }
.band.big { cursor: zoom-out; } .stage.pair .band { cursor: crosshair; }
.band img { display: block; user-select: none; }
.band-label { position: absolute; left: 0; top: 0; line-height: 1.3; font-size: 11px; font-weight: 600; background: #000c; color: #fff; padding: 1px 6px; border-bottom-right-radius: 4px; pointer-events: none; }
.band.photo .band-label { background: var(--accent); color: var(--accent-ink); }
.band .house { position: absolute; top: 0; bottom: 0; border-left: 1px solid #ffffff38; border-right: 1px solid #ffffff38; box-sizing: border-box; }
.band .house:hover { background: #ffffff12; }
.band .cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: #ff3d6e; box-shadow: 0 0 0 1px #0007; pointer-events: none; }
.layers .sep { width: 10px; } .layers button.mode.on { border-color: var(--claude); background: #2b2840; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.vbtns { display: flex; gap: 4px; } .verdict .status { grid-column: 1 / -1; }
.vb.on.better { background: var(--ok); color: #08130d; } .vb.on.worse { background: var(--bad); color: #1a0806; } .vb.on.same { background: var(--text); color: #111; }
textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex: none; }
.photos figure { margin: 0; flex: none; display: flex; flex-direction: column; gap: 2px; width: max-content; max-width: 220px; }
.photos img { height: 360px; width: auto; max-width: 360px; object-fit: contain; display: block; background: var(--photo-bg); border-radius: 4px; }
.photos figcaption { font-size: 12px; color: var(--muted); line-height: 1.3; } .photos figcaption strong { color: var(--text); font-weight: 500; }
h3 { margin: 8px 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }

/* stage 2: photo + render | fields */
.s2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 520px); gap: 14px; align-items: start; }
.pair { display: flex; gap: 10px; align-items: flex-end; justify-content: center; height: var(--imgh); background: var(--photo-bg); border-radius: 6px; padding: 8px; }
.pair figure, .stage4 figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pair img, .stage4 img { display: block; max-width: 100%; object-fit: contain; image-rendering: auto; }
.nophoto { color: var(--muted); padding: 40px 20px; border: 1px dashed var(--line); border-radius: 6px; }
.fields table { width: 100%; border-collapse: collapse; font-size: 13px; }
.fields th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 8px 3px 0; white-space: nowrap; vertical-align: top; }
.fields td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid #2a2e33; }
.fields tr.edited th { color: var(--accent); }
.fields select { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; max-width: 230px; }
.fields .val { color: var(--text); }
.swatch { display: inline-block; width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); vertical-align: middle; margin-left: 6px; }
button.mini { padding: 0 6px; font-size: 11px; margin-left: 4px; }
.src { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; line-height: 18px; border: 1px solid var(--line); white-space: nowrap; }
.src.strong { color: var(--ok); border-color: #2f5a41; } .src.mid { color: var(--text); } .src.weak { color: var(--warn); border-color: #6a5025; } .src.edit { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.others { font-size: 11px; color: var(--warn); } .others span { margin-right: 8px; }
/* stage 3: row + units */
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rowscroll { overflow-x: auto; background: var(--photo-bg); border-radius: 6px; padding: 6px; }
.rowbox { position: relative; height: min(52dvh, 560px); width: auto; }
.rowbox img { display: block; height: 50%; width: 100%; }
.rowbox .cells { position: absolute; inset: 0; }
.cell { position: absolute; top: 0; bottom: 0; padding: 0; border: 0; border-left: 1px solid #ffffff40; border-radius: 0; background: transparent; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; overflow: hidden; }
.cell .a, .cell .l { font-size: 11px; background: #000b; padding: 0 4px; margin: 0 0 2px 2px; border-radius: 3px; white-space: nowrap; }
.cell .l { color: var(--claude); }
.cell::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--uc); }
.cell.sel { background: #f2b33d33; outline: 2px solid var(--accent); outline-offset: -2px; }
.cell.linking { background: #9b8cf233; outline: 2px solid var(--claude); outline-offset: -2px; }
.u0 { --uc: #5cc28a; } .u1 { --uc: #f2b33d; } .u2 { --uc: #6fb3ef; } .u3 { --uc: #ef6b5b; } .u4 { --uc: #c78cf2; } .u5 { --uc: #e3e3e3; }
.units li::marker { color: var(--uc); } .units li { border-left: 4px solid var(--uc); padding-left: 6px; margin: 2px 0; list-style: none; }
.units, .links { padding: 0; margin: 0; font-size: 13px; } .links li { list-style: none; margin: 2px 0; }
.s3 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
/* stage 2: marks under the row, focus view */
.markbar { position: relative; height: 26px; margin-top: 3px; }
.markcell { position: absolute; top: 0; display: flex; gap: 2px; justify-content: center; padding: 0 1px; box-sizing: border-box; border-left: 1px solid #ffffff20; }
.mb { padding: 0 5px; min-width: 0; font: 700 11px/20px ui-sans-serif, sans-serif; border-radius: 4px; }
.mb.good.on { background: var(--ok); color: #000; border-color: var(--ok); }
.mb.wrong.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.mb.unsure.on { background: var(--warn); color: #000; border-color: var(--warn); }
.cell .mk { position: absolute; top: 4px; left: 4px; font: 700 11px/1.4 ui-sans-serif, sans-serif; padding: 0 5px; border-radius: 3px; background: #000b; }
.cell .mk.m-good { color: var(--ok); } .cell .mk.m-wrong { color: #fff; background: var(--bad); } .cell .mk.m-unsure { color: var(--warn); } .cell .mk.m-changed { color: #000; background: var(--claude); white-space: nowrap; }
.cell.m-wrong { box-shadow: inset 0 0 0 2px var(--bad); } .cell.m-changed { box-shadow: inset 0 0 0 2px var(--claude); }
.focus { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.focus .stage4 { height: min(62dvh, 640px); }
.wrongnote { display: flex; gap: 6px; align-items: center; } .wrongnote input { flex: 1; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--bad); border-radius: 5px; padding: 4px 6px; }
.fieldsbox summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
/* stage 4: views + pins */
.s4 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.stage4 { display: flex; gap: 10px; align-items: flex-end; justify-content: center; height: var(--imgh); background: var(--photo-bg); border-radius: 6px; padding: 8px; }
.pinbox { position: relative; display: inline-block; line-height: 0; cursor: crosshair; }
.pinbox img { max-height: 100%; }
.pin { position: absolute; transform: translate(-50%, -50%); min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; font: 700 11px/1 ui-sans-serif, sans-serif; background: var(--bad); color: #fff; border: 2px solid #fff; pointer-events: none; }
.pin.fixed { background: var(--claude); } .pin.resolved { background: var(--ok); } .pin.reopened { background: var(--warn); color: #000; } .pin.draft { background: var(--accent); color: #000; }
.pin.inline { position: static; transform: none; display: inline-grid; }
.rowimgs4 { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; background: var(--photo-bg); padding: 6px; border-radius: 6px; }
.rowimgs4 .pinbox { display: block; } .rowimgs4 img { height: min(30dvh, 320px); width: auto; max-width: none; }
.s4 aside { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.s4 aside h3 { margin: 6px 0 0; }
.pinform { background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.pinform input, .pinacts input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; width: 100%; }
.tagbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .tagbtns button { text-align: left; font-size: 12px; }
.pins { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; } .pinrow { list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.pinrow.resolved { opacity: .7; } .msg { font-size: 12px; margin-top: 3px; } .msg.claude b { color: var(--claude); }
.pinacts { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
.gaps { margin: 0; padding-left: 16px; font-size: 12px; }
.tag.st-fixed { color: var(--claude); border-color: var(--claude); } .tag.st-resolved { color: var(--ok); } .tag.st-open, .tag.st-reopened { color: var(--warn); }

/* stage 2, one house at a time */
.pand-head.one { align-items: center; flex-wrap: wrap; } .pand-head.one h2 { flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
.progress { flex: 1; max-width: 260px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; } .progress div { height: 100%; background: var(--ok); }
.onepair { display: flex; gap: 16px; align-items: flex-end; justify-content: center; height: min(64dvh, 680px); background: var(--photo-bg); border-radius: 8px; padding: 10px; }
.onepair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; height: 100%; justify-content: flex-end; }
.onepair img { display: block; max-width: 100%; object-fit: contain; }
.onepair figcaption { color: var(--muted); font-size: 12px; }
.ask { text-align: center; font-size: 17px; margin: 14px 0 8px; } .center { text-align: center; }
.marks3 { display: flex; gap: 12px; justify-content: center; }
button.big { font-size: 17px; padding: 10px 22px; border-radius: 8px; display: inline-flex; gap: 10px; align-items: center; }
button.big.good.on { background: var(--ok); color: #000; border-color: var(--ok); }
button.big.wrong.on { background: var(--bad); color: #fff; border-color: var(--bad); }
button.big.unsure.on { background: var(--warn); color: #000; border-color: var(--warn); }
.wrongbox { max-width: 760px; margin: 14px auto 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
.chip { font-size: 14px; padding: 6px 12px; border-radius: 16px; } .chip.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.wrongbox input { flex: 1; min-width: 200px; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }

.twopair { gap: 3px; } .pairbtn { flex-direction: row; text-align: left; } .pairbtn small { display: block; font-size: 12px; opacity: .7; }
button.big.pairbtn.claude { border: 2px dashed var(--claude); }
button.big.pairbtn.on { background: var(--accent); color: #000; border-color: var(--accent); }

@media (max-width: 760px) {
  :root { --imgh: 56dvh; }
  .bar { gap: 6px; padding: 6px 10px; }
  .bar .title { flex-basis: 100%; order: -1; }
