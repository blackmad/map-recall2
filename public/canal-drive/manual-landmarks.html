<!doctype html><html lang="en"><meta charset="utf-8"><title>Amsterdam landmark reconstructions</title><style>body{margin:0;background:#ebe7dd;color:#303b43;font:16px system-ui}header{padding:22px 32px}h1{font-size:24px;margin:0 0 8px}main{display:grid;grid-template-columns:1fr 1fr}article{border:1px solid #d4cfc3}h2{margin:16px 24px;font-size:18px}.view{height:400px}canvas{width:100%;height:100%}p{margin:8px 24px 18px;font-size:13px}</style><header><h1>Amsterdam landmark reconstructions</h1>Original flat-colour meshes · drag to orbit · scroll to zoom</header><main></main><script src="./js/three.bundle.js"></script><script type="module">
const {THREE:T,GLTFLoader,MeshoptDecoder}=window.CanalRecallThree;
const ids=['centraal-station','muziekgebouw-bimhuis','olvg-west','olvg-oost'];const names=['Amsterdam Centraal','Muziekgebouw / Bimhuis','OLVG West','OLVG Oost'];window.review={loaded:[],errors:[]};
for(let i=0;i<ids.length;i++){let article=document.createElement('article');article.innerHTML=`<h2>${names[i]}</h2><div class="view"></div><p><a href="./signature-landmark-demo.html?only=${ids[i]}">Inspect map placement</a></p>`;document.querySelector('main').append(article);let host=article.querySelector('.view');let renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(host.clientWidth,host.clientHeight);renderer.setClearColor('#ebe7dd');host.append(renderer.domElement);let scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x88806e,2));let sun=new T.DirectionalLight(0xffefce,2.2);sun.position.set(-100,200,150);scene.add(sun);let camera=new T.PerspectiveCamera(32,host.clientWidth/host.clientHeight,1,2000),target=new T.Vector3(),distance=200,theta=.55,phi=1.02;function draw(){camera.position.set(target.x+distance*Math.sin(phi)*Math.sin(theta),target.y+distance*Math.cos(phi),target.z+distance*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);renderer.render(scene,camera);}new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(`./models/${ids[i]}.glb`,g=>{scene.add(g.scene);let b=new T.Box3().setFromObject(g.scene);b.getCenter(target);distance=b.getSize(new T.Vector3()).length()*1.65;window.review.loaded.push(ids[i]);draw();},undefined,e=>window.review.errors.push(String(e)));let last;host.onpointerdown=e=>{last=[e.clientX,e.clientY];host.setPointerCapture(e.pointerId)};host.onpointerup=()=>last=null;host.onpointermove=e=>{if(last){theta-=(e.clientX-last[0])*.01;phi=Math.max(.1,Math.min(1.5,phi+(e.clientY-last[1])*.01));last=[e.clientX,e.clientY];draw()}};host.onwheel=e=>{e.preventDefault();distance*=Math.exp(e.deltaY*.001);draw()};}
</script></html>
