<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia Lab · Canal Recall</title>
<style>
.meter>button{grid-column:1/-1;justify-self:end;border:0;border-radius:999px;background:var(--ink);color:white;padding:8px 14px;font:inherit;font-weight:750;cursor:pointer}
:root{--ink:#17231f;--paper:#f4f0df;--green:#185c4b;--lime:#dff059;--coral:#ff765f;--blue:#83c9d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 8%,#fff 0 2px,transparent 3px),radial-gradient(circle at 85% 12%,#fff 0 3px,transparent 4px);background-size:37px 37px,71px 71px;opacity:.45}#app{width:min(1180px,calc(100% - 32px));margin:auto;padding:38px 0 80px;position:relative}header{background:var(--green);color:white;border-radius:28px;padding:28px 32px 24px;box-shadow:8px 8px 0 #123c34}.eyebrow{font-size:.72rem;letter-spacing:.18em;color:var(--lime);text-decoration:none}h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.9;margin:12px 0 16px;letter-spacing:-.07em}header p{max-width:650px;font-size:1.08rem}.cities,.views{display:flex;gap:9px;flex-wrap:wrap}.cities{margin-top:24px}.cities button,.views button{border:0;border-radius:999px;padding:10px 15px;font:inherit;font-weight:750;cursor:pointer;background:#ffffff20;color:inherit}.cities button.active{background:var(--lime);color:var(--ink)}.meter{margin:28px 0 18px;padding:18px 22px;border:2px solid var(--ink);border-radius:20px;background:#fff;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:16px;align-items:center}.meter>div{display:grid;grid-template-columns:auto 1fr;column-gap:8px}.meter small{display:block;font-size:.69rem;font-weight:500;opacity:.65}.meter strong{font-size:1.45rem}.dot{width:12px;height:12px;border-radius:50%;background:#aaa;margin-top:4px;grid-row:1/3}.live .dot{background:#41c979;box-shadow:0 0 0 7px #41c97928;animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(.7)}}.views{margin:20px 0 10px}.views button{background:#ddd5bd;color:var(--ink);font-size:1rem}.views button span{opacity:.6;margin-left:5px}.views button.active{background:var(--ink);color:white}.meaning{margin:12px 3px 22px;opacity:.72}.filters{display:flex;gap:10px;margin:0 0 20px;align-items:center;flex-wrap:wrap}.filters input,.filters select{font:inherit;background:white;border:2px solid #d1c9b3;border-radius:12px;padding:11px 13px}.filters input{flex:1;min-width:250px}.filters span{margin-left:auto;font-size:.8rem;opacity:.6}main{columns:3 290px;column-gap:16px}.card{break-inside:avoid;margin:0 0 16px;border:2px solid var(--ink);border-radius:18px;padding:19px;background:white;box-shadow:4px 4px 0 var(--ink)}.card.nope{background:#fff6f2;box-shadow:4px 4px 0 var(--coral)}.card.ok{background:#f3fbf6;box-shadow:4px 4px 0 #185c4b}.card.pending{background:#fffdf4}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.7rem;color:#65716d}.pill{background:var(--blue);color:var(--ink);padding:4px 8px;border-radius:99px;font-weight:800}.nope .pill{background:var(--coral)}h2{font-size:1.1rem;margin:14px 0 8px}.fact{font-family:Georgia,serif;font-size:1.12rem;line-height:1.42;margin:0 0 14px}.why{font-size:.83rem;background:#ffdcd3;padding:9px;border-radius:9px}details{border-top:1px dashed #aaa;padding-top:10px;margin-top:12px;font-size:.8rem}summary{cursor:pointer;font-weight:750}blockquote{margin:10px 0;padding-left:10px;border-left:3px solid var(--blue);line-height:1.45}.translation{background:#eef8f4;padding:9px;border-radius:8px}.translation b{display:block;margin-bottom:4px}.source{display:inline-block;margin-top:13px;color:var(--green);font-size:.78rem;font-weight:800}.empty,.loading{padding:60px;text-align:center;background:#fff;border:2px dashed #aaa;border-radius:20px}.review-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 18px;padding:14px 16px;border:2px solid var(--ink);border-radius:16px;background:#fff}.review-bar strong{font-size:.95rem}.review-bar button,.actions button,.fact-row>button{border:0;border-radius:999px;padding:8px 12px;font:inherit;font-weight:750;cursor:pointer;background:var(--ink);color:#fff}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.actions button{background:#ddd5bd;color:var(--ink)}.actions button.active{background:var(--green);color:#fff}.fact-row{margin:0 0 14px;padding-top:10px;border-top:1px dashed #ccc}.fact-row.struck .fact{opacity:.45;text-decoration:line-through}.fact-row>button{margin-top:4px;background:#fff;color:var(--ink);border:2px solid var(--ink)}.note{display:grid;gap:6px;margin-top:12px;font-size:.8rem;font-weight:750}.note textarea{font:inherit;font-weight:500;border:2px solid #d1c9b3;border-radius:12px;padding:10px;resize:vertical;min-height:64px}.file{position:relative;overflow:hidden;border-radius:999px;background:#ddd5bd;padding:8px 12px;font-weight:750;cursor:pointer}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}main:has(.card.review){columns:1;max-width:760px}@media(max-width:720px){#app{width:min(100% - 20px,1180px);padding-top:10px}header{padding:24px 20px}.meter{grid-template-columns:1fr 1fr}.meter>div{grid-column:1/-1}main{columns:1}}
</style></head><body><div id="app"><div class="loading">Opening the trivia lab…</div></div><script src="./js/trivia-review.bundle.js"></script></body></html>
