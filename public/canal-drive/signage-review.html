<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signage labelling</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0f14; --panel:#0d1319; --line:#1c2530; --dim:#93a1b1; --ink:#e8edf2; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; }
      h1 { margin:0; font-size:16px; font-weight:650; }
      .sub { color:var(--dim); font-size:12.5px; }
      main { display:grid; grid-template-columns:1fr 380px; height:calc(100vh - 58px); }
      #stage { position:relative; overflow:auto; padding:14px; }
      #wrap { position:relative; display:inline-block; }
      #crop { display:block; max-width:100%; height:auto; image-rendering:pixelated; }
      .box { position:absolute; border:2px solid #ffb300; pointer-events:none; }
      .box.sel { border-color:#00e5ff; }
      .box .lbl { position:absolute; top:-16px; left:0; font-size:11px; color:#ffb300; white-space:nowrap; }
      .box.sel .lbl { color:#00e5ff; }
      aside { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:14px; }
      h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.7px; color:#7f8fa1; margin:16px 0 6px; }
      table { width:100%; border-collapse:collapse; font-size:12.5px; }
      td { padding:3px 0; border-bottom:1px solid #161e27; }
      td:last-child { text-align:right; color:#cfe0f2; font-variant-numeric:tabular-nums; }
      button, select, input[type=text] { background:#16212c; color:var(--ink); border:1px solid #26323f; border-radius:6px; padding:5px 8px; font-size:12.5px; }
      button { cursor:pointer; }
      button.primary { background:#1d3a2a; border-color:#2f6b48; }
      button.warn { background:#3a2020; border-color:#6b3030; }
      .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
      .sign { border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:8px; background:#0f151c; }
      .sign.sel { border-color:#00e5ff; }
      .sign .head { display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim); margin-bottom:6px; }
      .sign input[type=text] { width:100%; margin-bottom:6px; }
      .swatch { width:20px; height:14px; border:1px solid #3a4652; border-radius:3px; display:inline-block; vertical-align:middle; }
      .vision { font-size:12px; color:var(--dim); background:#101820; border-left:3px solid #4da3ff; padding:6px 8px; border-radius:4px; margin:6px 0; }
      .done { color:#57d98a; }
      a { color:#6db2ff; }
    </style>
  </head>
  <body>
    <header>
      <h1>Signage labelling</h1>
      <span class="sub">Drag a box around each sign, type its text exactly, pick the type, and click the sign's background then its lettering. "No sign" is a valid answer. <span id="progress"></span></span>
    </header>
    <main>
      <div id="stage"><div id="wrap"><img id="crop" alt="" /><div id="boxes"></div></div></div>
      <aside>
        <h2>Frontage</h2>
        <table id="meta"></table>
        <div class="vision" id="vision"></div>
        <div class="row">
          <button id="prev">← prev</button>
          <button id="next">next →</button>
          <button id="nosign" class="warn">no sign here</button>
        </div>
        <h2>Signs on this frontage</h2>
        <div id="signs"></div>
        <h2>Save</h2>
        <div class="row">
          <button id="export" class="primary">download labels</button>
          <button id="importBtn">load labels</button>
          <input type="file" id="importFile" accept=".json" class="hidden" style="display:none" />
        </div>
        <p class="sub" id="savestate"></p>
      </aside>
    </main>
    <script>
      const BASE = '/data/signage/v1';
      const TYPES = ['fascia','blade','window','awning','logo','gevelsteen'];
      const el = (id) => document.getElementById(id);
      let sample = null, index = 0;
      let labels = JSON.parse(localStorage.getItem('signage-labels') || '{}');
      let selected = -1;
      let sampling = null; // 'bg' | 'fg'

      const current = () => sample.entries[index];
      const keyOf = (entry) => entry.id;

      const save = () => {
        localStorage.setItem('signage-labels', JSON.stringify(labels));
        el('savestate').textContent = `draft saved · ${Object.keys(labels).length} frontages labelled`;
      };

      const entryLabels = () => {
        const entry = current();
        if (!labels[keyOf(entry)]) labels[keyOf(entry)] = { id: entry.id, signs: [], noSign: false, reviewed: false };
        return labels[keyOf(entry)];
      };

      function renderMeta() {
        const entry = current();
        el('meta').innerHTML = `
          <tr><td>stratum</td><td>${entry.stratum}</td></tr>
          <tr><td>area</td><td>${entry.group}</td></tr>
          <tr><td>street</td><td>${entry.street || '—'}</td></tr>
          <tr><td>address</td><td>${entry.address || '—'}</td></tr>
          <tr><td>crop px/m</td><td>${entry.pixelsPerMetre.toFixed(0)}</td></tr>
          <tr><td>native px/m</td><td>${entry.nativeCeilingPxPerM}${entry.nativeCeilingPxPerM < 110 ? ' <span style="color:#ffb300">interpolated</span>' : ''}</td></tr>
          <tr><td>standoff / obliquity</td><td>${entry.standoffM.toFixed(1)} m / ${entry.obliquityDeg.toFixed(0)}°</td></tr>
          <tr><td>captured</td><td>${(entry.captureDate || '').slice(0,10) || '—'}</td></tr>`;
        el('vision').innerHTML = entry.visionSigns.length
          ? `<b>Vision read:</b><br>${entry.visionSigns.map((s) => `• ${s.text} <span style="color:#5b6b7c">(${s.confidence.toFixed(2)})</span>`).join('<br>')}`
          : 'Vision read nothing here.';
        el('progress').textContent = `${index + 1} / ${sample.entries.length}`;
      }

      function renderBoxes() {
        const entry = current();
        const img = el('crop');
        const sx = img.clientWidth / entry.widthPx, sy = img.clientHeight / entry.heightPx;
        const box = (b, i, sel) => `<div class="box${sel ? ' sel' : ''}" style="left:${b.left*sx}px;top:${b.top*sy}px;width:${b.width*sx}px;height:${b.height*sy}px"><span class="lbl">${b.text || '(no text)'}</span></div>`;
        el('boxes').innerHTML = entryLabels().signs.map((b, i) => box(b, i, i === selected)).join('');
      }

      function renderSigns() {
        const data = entryLabels();
        el('signs').innerHTML = (data.signs.length ? data.signs.map((b, i) => `
          <div class="sign${i === selected ? ' sel' : ''}" data-i="${i}">
            <div class="head"><span>sign ${i + 1}</span><span>${Math.round(b.width)}×${Math.round(b.height)} px</span></div>
            <input type="text" data-field="text" data-i="${i}" placeholder="text exactly as it appears" value="${(b.text || '').replace(/"/g,'&quot;')}" />
            <div class="row">
              <select data-field="type" data-i="${i}">${TYPES.map((t) => `<option${b.type === t ? ' selected' : ''}>${t}</option>`).join('')}</select>
              <label class="sub"><input type="checkbox" data-field="readable" data-i="${i}"${b.readable ? ' checked' : ''} /> readable</label>
            </div>
            <div class="row">
              <button data-sample="bg" data-i="${i}">bg <span class="swatch" style="background:${b.bg || '#000'}"></span></button>
              <button data-sample="fg" data-i="${i}">fg <span class="swatch" style="background:${b.fg || '#fff'}"></span></button>
              <button data-del="${i}" class="warn">delete</button>
            </div>
          </div>`).join('') : '<p class="sub">no signs drawn yet</p>')
          + `<p class="sub">${data.noSign ? '<span class="done">marked: no sign on this frontage</span>' : ''}</p>`;
      }

      function renderAll() { renderMeta(); renderBoxes(); renderSigns(); el('nosign').textContent = entryLabels().noSign ? 'unmark no-sign' : 'no sign here'; }

      const imagePixel = (event) => {
        const img = el('crop');
        const rect = img.getBoundingClientRect();
        const x = Math.round((event.clientX - rect.left) / rect.width * img.naturalWidth);
        const y = Math.round((event.clientY - rect.top) / rect.height * img.naturalHeight);
        return { x: Math.max(0, Math.min(img.naturalWidth - 1, x)), y: Math.max(0, Math.min(img.naturalHeight - 1, y)) };
      };

      let dragStart = null;
      el('wrap').addEventListener('pointerdown', (event) => {
        if (sampling) {
          const { x, y } = imagePixel(event);
          const entry = current();
          const img = el('crop');
          const sx = img.naturalWidth / entry.widthPx, sy = img.naturalHeight / entry.heightPx;
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
          const d = canvas.getContext('2d').getImageData(x, y, 1, 1).data;
          const hex = '#' + [d[0],d[1],d[2]].map((v) => v.toString(16).padStart(2,'0')).join('');
          const data = entryLabels();
          data.signs[sampling.i][sampling.kind] = hex;
          sampling = null; save(); renderAll();
          return;
        }
        dragStart = imagePixel(event);
      });
      el('wrap').addEventListener('pointerup', (event) => {
        if (!dragStart) return;
        const end = imagePixel(event);
        const left = Math.min(dragStart.x, end.x), top = Math.min(dragStart.y, end.y);
        const width = Math.abs(end.x - dragStart.x), height = Math.abs(end.y - dragStart.y);
        dragStart = null;
        if (width < 6 || height < 6) return;
        const data = entryLabels();
        data.signs.push({ left, top, width, height, text: '', type: 'fascia', readable: false, bg: null, fg: null });
        data.noSign = false;
        selected = data.signs.length - 1;
        save(); renderAll();
      });

      el('signs').addEventListener('input', (event) => {
        const i = Number(event.target.dataset.i); const field = event.target.dataset.field;
        if (field === undefined) return;
        const sign = entryLabels().signs[i];
        sign[field] = field === 'readable' ? event.target.checked : event.target.value;
        save(); renderBoxes();
      });
      el('signs').addEventListener('change', (event) => {
        const i = Number(event.target.dataset.i); const field = event.target.dataset.field;
        if (field === undefined) return;
        const sign = entryLabels().signs[i];
        sign[field] = field === 'readable' ? event.target.checked : event.target.value;
        save(); renderBoxes();
      });
      el('signs').addEventListener('click', (event) => {
        const del = event.target.dataset.del, sampleBtn = event.target.dataset.sample;
        if (del !== undefined) { entryLabels().signs.splice(Number(del), 1); selected = -1; save(); renderAll(); return; }
        if (sampleBtn) { sampling = { i: Number(event.target.dataset.i), kind: sampleBtn }; el('savestate').textContent = `click the sign's ${sampleBtn === 'bg' ? 'background' : 'lettering'} on the image`; return; }
        const card = event.target.closest('.sign');
        if (card) { selected = Number(card.dataset.i); renderBoxes(); }
      });

      el('nosign').addEventListener('click', () => { const d = entryLabels(); d.noSign = !d.noSign; d.signs = []; save(); renderAll(); });
      const go = (delta) => { index = Math.max(0, Math.min(sample.entries.length - 1, index + delta)); selected = -1; el('crop').src = `${BASE}/crops/${current().crop}`; renderAll(); };
      el('prev').addEventListener('click', () => go(-1));
      el('next').addEventListener('click', () => go(1));
      el('crop').addEventListener('load', renderAll);
      window.addEventListener('resize', renderBoxes);
      document.addEventListener('keydown', (event) => {
        if (event.target.tagName === 'INPUT') return;
        if (event.key === 'ArrowRight') go(1);
        if (event.key === 'ArrowLeft') go(-1);
      });

      el('export').addEventListener('click', () => {
        const payload = { schemaVersion: 1, kind: 'signage/labels', sampleSha256: sample.sha256, labelledAt: new Date().toISOString(), labels };
        const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `signage-labels-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      });
      el('importBtn').addEventListener('click', () => el('importFile').click());
      el('importFile').addEventListener('change', async (event) => {
        const file = event.target.files[0]; if (!file) return;
        const payload = JSON.parse(await file.text());
        labels = payload.labels || {};
        save(); renderAll();
      });

      fetch(`${BASE}/sample.json`).then((r) => r.json()).then((data) => {
        sample = data;
        el('crop').src = `${BASE}/crops/${current().crop}`;
        renderAll();
      }).catch((error) => { el('savestate').textContent = `failed to load sample: ${error.message}`; });
    </script>
  </body>
</html>
